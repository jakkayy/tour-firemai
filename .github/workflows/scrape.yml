name: Scrape Tours

on:
  schedule:
    - cron: "0 */6 * * *"  # ทุก 6 ชั่วโมง
  workflow_dispatch:         # รันมือได้จาก GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scrapers
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: the website's public address, once it has its own domain. Defaults to the Vercel one.
          SITE_URL: ${{ vars.SITE_URL }}
          # Optional: refresh the website's cached pages right after the scrape. Skipped when unset.
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ vars.REVALIDATE_URL }}
          # Optional: LINE alert for newly found tours. Skipped when unset.
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_BROADCAST: ${{ secrets.LINE_BROADCAST }}
          LINE_TO: ${{ secrets.LINE_TO }}
          # Tuning knobs (not secret). Unset means the defaults in scraper/notify.py.
          LINE_MIN_DISCOUNT: ${{ vars.LINE_MIN_DISCOUNT }}
          LINE_MIN_DEALS: ${{ vars.LINE_MIN_DEALS }}
          LINE_SEND_HOURS: ${{ vars.LINE_SEND_HOURS }}
          LINE_MIN_INTERVAL_HOURS: ${{ vars.LINE_MIN_INTERVAL_HOURS }}
        run: python main.py
